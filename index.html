<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Janu 💜</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f3e8ff;
    }
    h1 {
      margin-top: 100px;
      font-size: 28px;
      color: #5b21b6;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
    }
    #yes {
      background-color: #7c3aed;
      color: white;
    }
    #no {
      background-color: #a78bfa;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>

<h1 id="question">Janu, will you be my Valentine? 💜 🫣</h1>

<button id="yes">Yes 💜 🌚</button>
<button id="no">No 🥺😞</button>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const question = document.getElementById("question");

  const messages = [
    "Are you sure Janu? 🥺",
    "Really sure ah? 😞",
    "Think again please 🥺💜",
    "That hurts... 😞",
    "Don’t do this to me 🥺",
    "Okay… I’ll still wait 🫣💜"
  ];

  let i = 0;

  noBtn.addEventListener("click", () => {
    question.innerText = messages[i % messages.length];
    i++;

    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <h1 style="color:#5b21b6;">Yayyy 💜 🌚</h1>
      <h2>Janu, you just made Javith the happiest person 🫣</h2>
      <p>This is just the beginning 💫</p>
      <p>– From Javith 💜</p>
    `;
  });
</script>

</body>
</html>
